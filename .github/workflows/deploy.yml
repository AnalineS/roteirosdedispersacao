name: Deploy to Cloud Run

on:
  push:
    branches: [main, hml]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'hml'
        type: choice
        options:
          - hml
          - production
      service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev

jobs:
  # Determine what to deploy based on changed files
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend-nextjs/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'apps/backend/**'
              - '.github/workflows/deploy.yml'

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=hml" >> $GITHUB_OUTPUT
          fi

  # Deploy Frontend
  deploy-frontend:
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'frontend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set environment variables
        id: vars
        run: |
          ENV="${{ needs.changes.outputs.environment }}"
          if [ "$ENV" == "production" ]; then
            echo "SERVICE_NAME=${{ vars.PRODUCTION_FRONTEND_SERVICE }}" >> $GITHUB_OUTPUT
            echo "API_URL=${{ vars.NEXT_PUBLIC_API_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
            echo "DOMAIN=${{ vars.NEXT_PUBLIC_PRODUCTION_DOMAIN }}" >> $GITHUB_OUTPUT
            echo "BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "SERVICE_NAME=${{ vars.HML_FRONTEND_SERVICE }}" >> $GITHUB_OUTPUT
            echo "API_URL=${{ vars.NEXT_PUBLIC_API_URL_STAGING }}" >> $GITHUB_OUTPUT
            echo "DOMAIN=${{ vars.NEXT_PUBLIC_STAGING_DOMAIN }}" >> $GITHUB_OUTPUT
            echo "BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi
          echo "ENV=$ENV" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ vars.NODE_VERSION }}'
          cache: 'npm'
          cache-dependency-path: apps/frontend-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend-nextjs
        run: npm ci

      - name: CSP validation
        working-directory: apps/frontend-nextjs
        run: npm run validate:csp

      - name: Security tests
        working-directory: apps/frontend-nextjs
        run: npm run test:security

      - name: Build Frontend
        working-directory: apps/frontend-nextjs
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ steps.vars.outputs.SERVICE_NAME }}:${{ github.sha }}"

          docker build \
            --build-arg NEXT_PUBLIC_ENVIRONMENT=${{ steps.vars.outputs.ENV }} \
            --build-arg NEXT_PUBLIC_API_URL_PRODUCTION=${{ steps.vars.outputs.API_URL }} \
            --build-arg NEXT_PUBLIC_API_URL_STAGING=${{ steps.vars.outputs.API_URL }} \
            --build-arg NEXT_PUBLIC_PRODUCTION_DOMAIN=${{ steps.vars.outputs.DOMAIN }} \
            --build-arg NEXT_PUBLIC_STAGING_DOMAIN=${{ steps.vars.outputs.DOMAIN }} \
            --build-arg NEXT_PUBLIC_BASE_URL_PRODUCTION=${{ steps.vars.outputs.BASE_URL }} \
            --build-arg NEXT_PUBLIC_BASE_URL_STAGING=${{ steps.vars.outputs.BASE_URL }} \
            --build-arg NEXT_PUBLIC_BACKEND_URL=${{ steps.vars.outputs.API_URL }} \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
            -t $IMAGE .

          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy ${{ steps.vars.outputs.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port ${{ vars.FRONTEND_PORT }} \
            --memory ${{ vars.FRONTEND_MEMORY }} \
            --cpu ${{ vars.FRONTEND_CPU }} \
            --min-instances 0 \
            --max-instances ${{ vars.FRONTEND_MAX_INSTANCES }} \
            --set-env-vars="NODE_ENV=production,NEXT_PUBLIC_ENVIRONMENT=${{ steps.vars.outputs.ENV }}"

      - name: Frontend Deploy Summary
        run: |
          echo "## Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.vars.outputs.ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ steps.vars.outputs.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://${{ steps.vars.outputs.DOMAIN }}" >> $GITHUB_STEP_SUMMARY

  # Deploy Backend
  deploy-backend:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'backend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set environment variables
        id: vars
        run: |
          ENV="${{ needs.changes.outputs.environment }}"
          if [ "$ENV" == "production" ]; then
            echo "SERVICE_NAME=${{ vars.PRODUCTION_BACKEND_SERVICE }}" >> $GITHUB_OUTPUT
            echo "FRONTEND_URL=${{ vars.NEXT_PUBLIC_BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
            CORS_RAW="${{ vars.CORS_ORIGINS_PROD_SAFE }}"
            echo "CORS_ORIGINS=${CORS_RAW//;/,}" >> $GITHUB_OUTPUT
            echo "LOG_LEVEL=${{ vars.LOG_LEVEL_PROD }}" >> $GITHUB_OUTPUT
            echo "FLASK_ENV=${{ vars.FLASK_ENV_PROD }}" >> $GITHUB_OUTPUT
            echo "DEBUG=${{ vars.DEBUG_MODE_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "SERVICE_NAME=${{ vars.HML_BACKEND_SERVICE }}" >> $GITHUB_OUTPUT
            echo "FRONTEND_URL=${{ vars.NEXT_PUBLIC_BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
            CORS_RAW="${{ vars.CORS_ORIGINS_HML_SAFE }}"
            echo "CORS_ORIGINS=${CORS_RAW//;/,}" >> $GITHUB_OUTPUT
            echo "LOG_LEVEL=${{ vars.LOG_LEVEL_HML }}" >> $GITHUB_OUTPUT
            echo "FLASK_ENV=${{ vars.FLASK_ENV_HML }}" >> $GITHUB_OUTPUT
            echo "DEBUG=${{ vars.DEBUG_MODE_HML }}" >> $GITHUB_OUTPUT
          fi
          echo "ENV=$ENV" >> $GITHUB_OUTPUT

      - name: Build Backend
        working-directory: apps/backend
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ steps.vars.outputs.SERVICE_NAME }}:${{ github.sha }}"

          docker build -t $IMAGE .

          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Clear existing secret mounts from Cloud Run service
        run: |
          gcloud run services update ${{ steps.vars.outputs.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --clear-secrets \
            --quiet || true

      - name: Deploy Backend to Cloud Run
        run: |
          ENV_VARS="^;^"
          ENV_VARS+="ENVIRONMENT=${{ steps.vars.outputs.ENV }}"
          ENV_VARS+=";FLASK_ENV=${{ steps.vars.outputs.FLASK_ENV }}"
          ENV_VARS+=";DEBUG=${{ steps.vars.outputs.DEBUG }}"
          ENV_VARS+=";LOG_LEVEL=${{ steps.vars.outputs.LOG_LEVEL }}"
          ENV_VARS+=";CORS_ORIGINS=${{ steps.vars.outputs.CORS_ORIGINS }}"
          ENV_VARS+=";FRONTEND_URL=${{ steps.vars.outputs.FRONTEND_URL }}"
          ENV_VARS+=";RAG_ENABLED=${{ vars.RAG_ENABLED }}"
          ENV_VARS+=";EMBEDDINGS_ENABLED=${{ vars.EMBEDDINGS_ENABLED }}"
          ENV_VARS+=";OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"
          ENV_VARS+=";SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}"
          ENV_VARS+=";PASSWORD_SALT=${{ secrets.PASSWORD_SALT }}"
          ENV_VARS+=";GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}"
          ENV_VARS+=";SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
          ENV_VARS+=";SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}"
          ENV_VARS+=";SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          ENV_VARS+=";SUPABASE_DB_URL=${{ secrets.SUPABASE_DB_URL }}"
          ENV_VARS+=";SUPABASE_JWT_SIGNING_KEY=${{ secrets.SUPABASE_JWT_SIGNING_KEY }}"
          ENV_VARS+=";HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}"
          ENV_VARS+=";GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}"
          ENV_VARS+=";GCP_REGION=${{ vars.GCP_REGION }}"
          ENV_VARS+=";EMBEDDING_MODEL=${{ vars.EMBEDDING_MODEL }}"
          ENV_VARS+=";SEMANTIC_SIMILARITY_THRESHOLD=${{ vars.SEMANTIC_SIMILARITY_THRESHOLD }}"
          ENV_VARS+=";SUPABASE_VECTOR_SIMILARITY_THRESHOLD=${{ vars.SUPABASE_VECTOR_SIMILARITY_THRESHOLD }}"
          ENV_VARS+=";EMAIL_FROM=${{ vars.EMAIL_FROM }}"
          ENV_VARS+=";EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}"
          ENV_VARS+=";SESSION_COOKIE_SECURE=${{ vars.SESSION_COOKIE_SECURE }}"
          ENV_VARS+=";ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}"

          gcloud run deploy ${{ steps.vars.outputs.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port ${{ vars.BACKEND_PORT }} \
            --memory ${{ vars.BACKEND_MEMORY }} \
            --cpu ${{ vars.BACKEND_CPU }} \
            --min-instances 0 \
            --max-instances ${{ vars.BACKEND_MAX_INSTANCES }} \
            --timeout ${{ vars.BACKEND_TIMEOUT }} \
            --cpu-boost \
            --set-env-vars="$ENV_VARS"

      - name: Backend Deploy Summary
        run: |
          echo "## Backend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.vars.outputs.ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ steps.vars.outputs.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          URL=$(gcloud run services describe ${{ steps.vars.outputs.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "- **URL**: $URL" >> $GITHUB_STEP_SUMMARY
